# Spenddat purchasing policy.
# Bump `version` on every change; the SHA-256 of this file is appended automatically and
# recorded on every decision, so the audit log always shows exactly which rules applied.
# All amounts are integer cents (minor units).
version: "2026-09-29.1"
currency: usd

vendors:
  # Vendors that may be purchased from autonomously (must have an adapter).
  allow: [acp_merchant]
  # Hard blocks: requests for these are DENIED outright, never escalated.
  deny: [sketchy_mart]

categories:
  allow:
    - electronics_accessories
    - office_supplies
    - household
    - books
    - personal_care
  deny:
    - subscriptions
    - gift_cards
    - alcohol
    - tobacco
    - weapons
    - prescription_drugs
    - financial_products

caps:
  per_transaction_minor: 5000          # $50.00  -> above this, escalate
  per_category_minor:
    electronics_accessories: 3000      # $30.00
    office_supplies: 7500              # $75.00 (effective limit is min(this, per_transaction))
    books: 4000                        # $40.00
  daily_minor: 15000                   # $150.00 rolling 24h
  weekly_minor: 40000                  # $400.00 rolling 7d

anomaly:
  price_deviation_pct: 40              # unit price vs rolling average of past purchases
  min_history: 3                       # need this many past purchases before judging price
  history_days: 30
  velocity:
    max_purchases: 5                   # more than this many completed purchases...
    window_minutes: 60                 # ...within this window escalates

approval:
  timeout_minutes: 60                  # unanswered escalations auto-deny after this
